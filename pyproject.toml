[project]
name = "nubi"
version = "0.1.0"
description = "Nubi — rede neural de picos (SNN) com aprendizado por reforço, que aprende com você"
requires-python = ">=3.10"
dependencies = ["numpy", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nubi"]
